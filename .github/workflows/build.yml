name: Build Shop Scraper Mod

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Set execute permissions for gradlew
      run: |
        mkdir -p gradle/wrapper
        curl -L -o gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/releases/download/v8.10.0/gradle-8.10-wrapper.jar
        chmod +x gradlew

    - name: Build with Gradle
      run: |
        chmod +x gradlew
        ./gradlew build

    - name: Upload JAR artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: shop-scraper-mod
        path: build/libs/shop-scraper-1.0.0.jar
        retention-days: 30

    - name: Create Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: build/libs/shop-scraper-1.0.0.jar
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}